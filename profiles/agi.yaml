description: AgI DPA4 MD sampling defaults validated by the local case study.
precheck:
  supercell: [5, 5, 3]
  mesh: [13, 13, 7]
md:
  ensemble: npt
  repeat: [3, 3, 2]
  temperatures_k: [50, 300]
  pressure_gpa: 0.0
  equilibration_steps: 2000
  production_steps: 10000
  save_interval_steps: 10
selection:
  max_structures: 100
  entropy_fraction: 0.95
